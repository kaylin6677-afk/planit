<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Georgia Student Planner</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="brand" style="justify-content:center; margin-bottom: 6px;">📘 Georgia Student Planner</div>
  <p class="sub" style="text-align:center;">Sign up or log in to your planner.</p>

  <div class="auth-tabs">
    <button id="tab-login" class="auth-tab active">Log In</button>
    <button id="tab-signup" class="auth-tab">Sign Up</button>
  </div>

  <form id="login-form" class="auth-form">
    <label>Email</label>
    <input type="email" id="login-email" required>
    <label>Password</label>
    <input type="password" id="login-password" required>
    <button type="submit">Log In</button>
    <p id="login-error" class="status err"></p>
  </form>

  <form id="signup-form" class="auth-form hidden">
    <label>Name</label>
    <input type="text" id="signup-name" required>
    <label>Email</label>
    <input type="email" id="signup-email" required>
    <label>Password</label>
    <input type="password" id="signup-password" required minlength="6">
    <p class="muted" style="margin: 4px 0 0;">At least 6 characters.</p>
    <button type="submit">Create Account</button>
    <p id="signup-error" class="status err"></p>
  </form>
</div>

<script>
const tabLogin = document.getElementById("tab-login");
const tabSignup = document.getElementById("tab-signup");
const loginForm = document.getElementById("login-form");
const signupForm = document.getElementById("signup-form");

tabLogin.addEventListener("click", () => {
  tabLogin.classList.add("active");
  tabSignup.classList.remove("active");
  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");
});
tabSignup.addEventListener("click", () => {
  tabSignup.classList.add("active");
  tabLogin.classList.remove("active");
  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "Something went wrong."; return; }
    window.location.href = "/";
  } catch (err) {
    errEl.textContent = "Couldn't reach the server.";
  }
});

signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("signup-name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const errEl = document.getElementById("signup-error");
  errEl.textContent = "";
  try {
    const res = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "Something went wrong."; return; }
    window.location.href = "/";
  } catch (err) {
    errEl.textContent = "Couldn't reach the server.";
  }
});
</script>
</body>
</html>
